name: Release APK

# Builds the sideload APK and attaches it to a GitHub Release.
#
# Trigger it by pushing a tag:   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab ("Run workflow"), which builds without creating a release.
#
# The published asset name is stable, so a Fire TV Downloader URL never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/torfilx-release.apk

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Instrumented tests need an emulator, so they run in their own job. It does not gate the release
  # job (an emulator can be flaky in CI), but it does run the Room migration test — the guard against
  # the first schema change crash-looping every device — on every push and PR.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Migration + instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: ./gradlew :core:data:connectedDebugAndroidTest --no-daemon --stacktrace

  build:
    runs-on: ubuntu-latest

    # Secrets are mapped to env here because the `secrets` context is not available in a step-level
    # `if:` — referencing it there makes GitHub reject the whole workflow before any job starts.
    env:
      KEYSTORE_B64: ${{ secrets.TORFILX_KEYSTORE_BASE64 }}
      TORFILX_KEYSTORE_PASSWORD: ${{ secrets.TORFILX_KEYSTORE_PASSWORD }}
      TORFILX_KEY_ALIAS: ${{ secrets.TORFILX_KEY_ALIAS }}
      TORFILX_KEY_PASSWORD: ${{ secrets.TORFILX_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # Decide how this release is signed. With the persistent keystore it is a proper, upgradeable
      # release; without it, AGP falls back to an ad-hoc debug key that differs every run, so the
      # build is NOT upgradeable in place. Rather than block, publish it but mark it loudly as a
      # debug-signed test build (the warning is prepended in "Compose release notes" below) — the
      # danger the guard exists to prevent is a *silent* non-upgradeable release, not a labelled one.
      - name: Determine signing mode
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$TORFILX_KEYSTORE_PASSWORD" ] \
             && [ -n "$TORFILX_KEY_ALIAS" ] && [ -n "$TORFILX_KEY_PASSWORD" ]; then
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release will be signed with the persistent keystore."
          else
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No release keystore configured — publishing a DEBUG-SIGNED test build (not upgradeable in place). See docs/RELEASING.md to configure signing."
          fi

      # A release tag and the APK's own version must agree, or devices see a "new" release whose
      # APK reports an unchanged version and may refuse to treat it as an upgrade.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '[0-9][^"]*')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versionName $version."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only platform-tools here: the action's default also asks for the legacy `tools` package, which
      # Google no longer publishes, and sdkmanager then fails the whole job. The next step installs the
      # platform and build tools the build needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Platform 36 is on the public channel and on the runner images. The dependency set is pinned
      # to versions that compile against 36 for exactly this reason: platform 37 is only published
      # through a preview channel, so CI could never fetch it.
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      # The strict lint gate (warningsAsErrors, abortOnError) only protects anything if it actually
      # runs. It is baselined against known cosmetic debt, so this fails the build on *new* issues.
      - name: Lint
        run: ./gradlew :app:lintRelease --no-daemon --stacktrace

      # Signing: a real keystore is used when the repository secrets are present, otherwise the
      # debug key. A debug-signed APK sideloads onto a Fire TV fine — what matters is that every
      # build uses the *same* key, or the device refuses to upgrade in place.
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TORFILX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage the APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/torfilx-release.apk
          sha256sum dist/torfilx-release.apk | tee dist/torfilx-release.apk.sha256
          ls -lh dist/

      # Record which certificate actually signed the APK. A change in this fingerprint between
      # releases is the exact condition that blocks in-place upgrades, so it is logged on every run.
      - name: Record the signing certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist/torfilx-release.apk | tee dist/signer-certs.txt
          else
            echo "apksigner not found; skipping certificate print." | tee dist/signer-certs.txt
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torfilx-release-apk
          path: |
            dist/torfilx-release.apk
            dist/torfilx-release.apk.sha256

      # Build the release body in shell so the debug-signed warning can be prepended conditionally.
      # A debug-signed build is fine to sideload for testing, but it cannot upgrade an existing
      # install (different key), so it is called out at the top of the notes.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            if [ "$RELEASE_SIGNED" != "true" ]; then
              echo "> ⚠️ **Debug-signed test build.** Signed with an ad-hoc key that changes every build, so it **cannot upgrade an existing install** — uninstall any previous TORFILX before installing this one. Configure a release keystore (see \`docs/RELEASING.md\`) for proper upgradeable releases."
              echo ""
            fi
            echo "**Sideload onto a Fire TV**"
            echo ""
            echo "In the Downloader app, enter:"
            echo ""
            echo '```'
            echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/torfilx-release.apk"
            echo '```'
            echo ""
            echo "or from a PC on the same network:"
            echo ""
            echo '```'
            echo "adb connect <fire-tv-ip>:5555"
            echo "adb install -r torfilx-release.apk"
            echo '```'
            echo ""
            echo "Runs on Fire OS 5 and later (Android 5.1 / API 22). Signed with the v1, v2 and v3 schemes."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/torfilx-release.apk
            dist/torfilx-release.apk.sha256
          generate_release_notes: true
          # Every tagged build is published as a full release and becomes "Latest".
          #
          # These were previously flagged as prereleases whenever no signing keystore was
          # configured. The intent was good — a debug-signed APK cannot upgrade an existing install
          # — but the effect was worse than the problem: GitHub excludes prereleases from "Latest",
          # so `releases/latest/download/torfilx-release.apk` kept serving v0.1.8 from August while
          # every newer build sat one page down. That link is the one in the README and the one
          # Downloader users paste into a Fire TV, so the safety label was quietly handing people a
          # months-old build.
          #
          # The warning that actually matters is still there, at the top of the release body where
          # someone will read it, rather than encoded in a flag that breaks the download URL.
          prerelease: false
          make_latest: true
          body_path: ${{ runner.temp }}/release-notes.md
