# GitHub Actions workflow example for publishing the catalogue with publish-catalog.sh.
#
# To use this:
# 1. Save the publisher seed as a repository secret named PUBLISHER_SEED
#    (Settings → Secrets and variables → Actions → New repository secret).
# 2. Save this file as .github/workflows/publish-catalogue.yml.
# 3. Provide the add/ and remove/ folders: they are not in the repository (it is public). The step
#    below downloads them from a private location; replace it with whatever you use.
#
# A checkout gives every file the same modification time, so files are ranked by name (--order name):
# name them so they sort by age, e.g. 2026-09-24-new-films.json. A runner has no earlier releases
# either, so the version must be given, and it must be higher than the last release published:
# televisions ignore any release that is not newer than the one they have.

name: Publish Catalogue

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release number, higher than the last one published'
        required: true
      hours:
        description: 'Hours to publish; hosted runners stop a job after 6 hours'
        required: false
        default: '5.5'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Fetch the catalogue folders
        run: |
          # Replace with your own source of catalogue files, for example a private repository:
          # git clone --depth 1 https://x-access-token:${{ secrets.CATALOGUE_TOKEN }}@github.com/<you>/<catalogue-repo> /tmp/catalogue
          # cp -r /tmp/catalogue/add /tmp/catalogue/remove scripts/publish-catalog/
          test -d scripts/publish-catalog/add || { echo "no add/ folder"; exit 1; }

      - name: Write the seed
        run: |
          umask 077
          printf '%s\n' "${{ secrets.PUBLISHER_SEED }}" > "$RUNNER_TEMP/publisher.seed"

      - name: Publish
        run: |
          bash scripts/publish-catalog/publish-catalog.sh "$RUNNER_TEMP/publisher.seed" \
            --order name \
            --strict \
            --version "${{ github.event.inputs.version }}" \
            --hours "${{ github.event.inputs.hours || '5.5' }}"

      - name: Keep the merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-report
          path: scripts/publish-catalog/output/merge-report.txt
          if-no-files-found: ignore

      - name: Remove the seed
        if: always()
        run: rm -f "$RUNNER_TEMP/publisher.seed"
